_target_: vla_streaming_rl.networks.modules.policy_head.TokenDiffusionPolicy
_partial_: true
# 状態のトークンの幅（VLA の位置ごとの射影の幅）と、行動・時刻のトークンと混ぜる層
token_dim: ${vla.state_out_dim}
mixer_layers: 2
mixer_heads: 4
mixer_layer_scale_init: 0.0001
hidden_dim: 512
block_num: 1
horizon: ${horizon}
sparsity: ${sparsity}
denoising_time: 0.9
denoising_steps: 1
dacer_loss_weight: 0.05
detach_state: true
