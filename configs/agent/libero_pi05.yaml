# @package _global_
# pi0.5 (LeRobot PI05Policy) + flow-matching policy RL on LIBERO.
#
# The pi0.5 backbone (PaliGemma vision + LLM) is frozen; only the action expert
# (the flow-matching policy μ) and the injected action-value critic learn. The
# agent reads the wrist camera / proprio / language instruction directly from
# LiberoEnv (the single-RGB observation slot only carries the agentview).
#
# Learning (see networks/libero_pi05_network.py):
#   * Critic — TD bootstrap on action chunks; the bootstrap action π(s') is
#     sampled from pi0.5 itself. State = mean-pooled VLM prefix ⊕ proprio.
#   * Actor — DACER2 (the project's flow-matching policy-RL loss): advantage
#     maximization -E[Q(s, π(s))] through pi0.5's differentiable denoiser, plus
#     a Q-gradient-guided flow-matching term toward a Q-improved action.
#
# The pi0.5 checkpoint (policy weights + LIBERO normalization stats) is pulled
# from the HF hub into the local cache on first use.
defaults:
  - base_network
  - base_off_policy
  - base_streaming
  - base_cnn
  - base_vlm
  - _self_

agent_type: libero_pi05
learning_mode: off_policy
network_class: libero_pi05

# Overrides consumed by LiberoPi05Agent / LiberoPi05Network.
image_save_interval: 50
print_interval: 1
batch_size: 1
# Warmup before the first update; also ensures the buffer holds a few episodes
# of chunk transitions before TD learning starts.
learning_starts: 1
# Replay holds one packed transition PER ENV STEP (preprocessed pi0.5 batch +
# executed normalized action + reward + done); training samples a chunk_size+1
# sliding window, so any window is a valid chunk transition (no fixed
# boundaries). Sized in steps — keep modest since each row packs two images.
buffer_size: 8000

# The critic scores the full pi0.5 action chunk, so the value-head horizon must
# equal the policy's chunk_size (asserted in the network).
horizon: 50

# Fine-tuning LRs: tiny actor LR so the expert is nudged, not overwritten;
# the critic learns faster.
actor_lr: 0.0
critic_lr: 5e-5

# DACER2 actor knobs.
# actor_denoising_steps : Euler steps when sampling π(s) for the (differentiable)
#                         advantage term and the (no-grad) TD bootstrap. Fewer
#                         than num_inference_steps(=10) to bound the unrolled
#                         expert backward cost.
# q_grad_eta            : action-space step size for the Q-improved target a* =
#                         clip(π(s) + eta·∂Q/∂a) the flow term regresses toward.
# dacer_loss_weight     : weight of the Q-guided flow-matching term (inherited
#                         default 0.05 from base_off_policy; pinned here).
actor_denoising_steps: 1
q_grad_eta: 0.05
dacer_loss_weight: 0.05

# VLAC online milestone dense reward (src/vla_streaming_rl/networks/vlac). When
# enabled, every check_interval env steps the vendored VLAC critic scores the
# current agentview frame against the held key (milestone) frame; the diminishing-
# returns progress becomes a potential Phi and a PBRS dense reward
# alpha*(gamma*Phi_t-Phi_prev) is added to that step's reward in real time. The key
# advances every milestone_interval steps. Weights live outside git; the loader
# pulls InternRobotics/VLAC into the HF cache on first use (model code is vendored).
vlac:
  enabled: true
  device_map: cuda:0
  temperature: 0.5
  top_k: 1
  milestone_interval: 64
  check_interval: 8
  alpha: 1.0
  gamma: 0.99
  value_scale: 100.0
