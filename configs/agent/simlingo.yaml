# @package _global_
# SimLingo VLM + DDPG RL: the SimLingo waypoint heads are trained
# directly to maximize a learned Q (deterministic policy gradient).
#
# Sensors come from CARLALeaderboardEnv's info["sensors"] (rgb / gps /
# imu / speed) — SimLingoAgent does NOT spawn its own sensor stack, so
# the leaderboard SensorInterface + CallBack wiring isn't needed.
#
# The trainer still builds an RL ``network`` (consumes the env's
# observation_space) and a goal_predictor unconditionally — SimLingo
# ignores both. We inherit cnn_streaming's bases so build_network has
# the keys it needs; the resulting CNN sits idle.
#
# The SimLingo VLM checkpoint is always pulled from huggingface
# (RenzKa/simlingo) into the local HF cache via snapshot_download —
# nothing to configure here.
defaults:
  - base_network
  - base_off_policy
  - base_on_policy
  - base_streaming
  - base_cnn
  - base_vlm
  - _self_

agent_type: simlingo
# Built-but-unused RL net (the trainer still builds one against the
# env's observation_space). Mirrors cnn_streaming.yaml's choice.
network_class: actor_critic_with_action_value

# Overrides of base_*/default values consumed by SimLingoAgent.
image_save_interval: 50
print_interval: 1
batch_size: 1
learning_starts: 800
# Each replay slot holds the per-query VLM features (30 × hidden) + the
# action for that step, so a slot is larger than before but the frozen
# VLM is never re-forwarded at training time; only the waypoint heads are
# re-applied to the cached features.
buffer_size: 8192

# SimLingo-specific keys (no equivalent in base_* / default).
# Std of the Gaussian exploration noise added to the deterministic
# waypoint action μ(s) at rollout time (per waypoint coord, in meters).
# Set to 0 for greedy evaluation.
exploration_noise: 0.0
actor_lr: 2e-7
critic_lr: 5e-7

# Training mode for the waypoint-head policy / critic:
#   off_policy : random replay batches (DDPG, the default).
#   streaming  : online TD(λ) on the latest transition every step, critic
#                via AdamET eligibility traces (uses ``et_lambda`` from
#                base_streaming). Actor stays DDPG (-Q) + AdamW.
learning_mode: off_policy

# Critic architecture:
#   simbav2 : SimbaV2 hyperspherical critic (arXiv:2502.15280). Weights and
#             features are constrained to the unit hypersphere, so the critic's
#             norm cannot blow up under the TD loss — the countermeasure for the
#             "good early, score degrades mid-training" instability.
#   dueling : original LayerNorm dueling V/A critic.
critic_arch: dueling
# SimbaV2 input shift constant c_shift (Eq. 9); paper default is 3.0.
critic_c_shift: 3.0
# Atoms for the distributional (categorical) critic head (SimbaV2 §4.3), trained
# with an HL-Gauss cross-entropy loss. The support auto-expands as returns grow.
# Reference uses 101. Set to 1 for a scalar MSE critic. Overrides base_network's
# default of 1 (also feeds the built-but-unused RL net, harmlessly).
num_bins: 101
