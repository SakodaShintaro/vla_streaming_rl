# @package _global_
# SimLingo VLM + DACER2 RL on top of waypoint output.
#
# Sensors come from CARLALeaderboardEnv's info["sensors"] (rgb / gps /
# imu / speed) — SimLingoAgent does NOT spawn its own sensor stack, so
# the leaderboard SensorInterface + CallBack wiring isn't needed.
#
# The trainer still builds an RL ``network`` (consumes the env's
# observation_space) and a goal_predictor unconditionally — SimLingo
# ignores both. We inherit cnn_streaming's bases so build_network has
# the keys it needs; the resulting CNN sits idle.
#
# The SimLingo VLM checkpoint is always pulled from huggingface
# (RenzKa/simlingo) into the local HF cache via snapshot_download —
# nothing to configure here.
defaults:
  - base_network
  - base_off_policy
  - base_on_policy
  - base_streaming
  - base_cnn
  - base_vlm
  - _self_

agent_type: simlingo
# Built-but-unused RL net (the trainer still builds one against the
# env's observation_space). Mirrors cnn_streaming.yaml's choice.
network_class: actor_critic_with_action_value

# Overrides of base_*/default values consumed by SimLingoAgent.
batch_size: 4
learning_starts: 1000
actor_hidden_dim: 256
critic_hidden_dim: 512
denoising_time: 1.0
denoising_steps: 4
max_grad_norm: 1.0
# Each replay slot also holds a CPU copy of that step's DrivingInput
# (camera_images is the dominant term, ~3 MB bfloat16) so the critic
# can re-forward the VLM at training time. 1024 ≈ 3 GB CPU RAM.
buffer_size: 1024

# SimLingo-specific keys (no equivalent in base_* / default).
tau: 0.005
# Scale applied to the tanh-bounded Δ before adding to base
# waypoints. With δ_scale=0.1 the residual is capped at ±0.1 per
# waypoint coord, matching the magnitude that PID can absorb.
delta_scale: 0.1
actor_lr: 1e-5
critic_lr: 1e-4
