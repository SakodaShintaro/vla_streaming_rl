# @package _global_
# SimLingo VLM + DDPG RL: the SimLingo waypoint heads are trained
# directly to maximize a learned Q (deterministic policy gradient).
#
# Sensors come from CARLALeaderboardEnv's info["sensors"] (rgb / gps /
# imu / speed) — SimLingoAgent does NOT spawn its own sensor stack, so
# the leaderboard SensorInterface + CallBack wiring isn't needed.
#
# The trainer still builds an RL ``network`` (consumes the env's
# observation_space) unconditionally — SimLingo ignores it. We inherit
# the base agent configs so build_network has the keys it needs; the
# resulting CNN sits idle.
#
# The SimLingo VLM checkpoint is always pulled from huggingface
# (RenzKa/simlingo) into the local HF cache via snapshot_download —
# nothing to configure here.
defaults:
  - base_network
  - base_off_policy
  - base_streaming
  - base_vlm
  - _self_

agent_type: simlingo
# The SimLingo VLM + waypoint heads (policy μ) + Q critic, built by
# ``build_network`` (networks/simlingo_network.py) and passed to SimLingoAgent.
network_class: simlingo

# Overrides of base_*/default values consumed by SimLingoAgent.
image_save_interval: 50
print_interval: 1
batch_size: 1
learning_starts: 800
# Each replay slot holds the per-query VLM features (30 × hidden) + the
# action for that step, so a slot is larger than before but the frozen
# VLM is never re-forwarded at training time; only the waypoint heads are
# re-applied to the cached features.
buffer_size: 8192

# SimLingo-specific keys (no equivalent in base_* / default).
# Std of the Gaussian exploration noise added to the deterministic
# waypoint action μ(s) at rollout time (per waypoint coord, in meters).
# Set to 0 for greedy evaluation.
exploration_noise: 0.0
actor_lr: 2e-7
critic_lr: 5e-7

# How the agent samples transitions + updates the critic (the agent-level
# axis; the actor loss is chosen separately by ``actor_loss_type``):
#   off_policy : random replay batches, critic via AdamW.
#   streaming  : online TD(λ) on the latest transition every step, critic
#                via AdamET eligibility traces (uses ``et_lambda`` from
#                base_streaming).
learning_mode: off_policy

# Which actor loss trains the waypoint heads (owned by the network, so the
# agent does not branch on it):
#   ddpg : deterministic policy gradient, −Q(s, μ(s)).
#   awr  : advantage-weighted regression — sample ``awr_num_samples`` actions
#          per state, score each with Q, normalize per state and softmax-weight
#          them (``awr_temperature``), then regress the heads toward the
#          higher-Q samples.
actor_loss_type: ddpg

# Advantage-weighted-regression actor knobs (``actor_loss_type: awr`` only).
# awr_num_samples : candidate actions sampled per state (sample 0 is μ(s)).
# awr_temperature : softmax temperature on the per-state z-scored Q advantages;
#                   lower → weights concentrate harder on the best samples.
# awr_sample_noise: Gaussian std of the candidate actions around μ(s)
#                   (per waypoint coord, meters).
awr_num_samples: 16
awr_temperature: 0.1
awr_sample_noise: 0.1
