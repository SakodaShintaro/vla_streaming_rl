# @package _global_
defaults:
  - base/network
  # 状態のトークンの幅が VLA と違うので、行動のトークンと混ぜない critic と方策を使う
  - override /value_head: dueling
  - override /policy_head: diffusion
  - _self_

agent_type: off_policy
network_class: actor_critic_with_action_value
batch_size: 16
actor_lr: 1e-5
critic_lr: 1e-5
learning_starts: 2000
actor_critic:
  disable_state_predictor: true
