# @package _global_
defaults:
  - /policy_head: tanh
  - /value_head: dueling
  - /prediction_head: td_jepa  # [flow_matching, td_jepa]
  - _self_

weight_decay: 0.01

vla:
  model_id: Qwen/Qwen3.8-27B
  load_in_4bit: true
  # VLM の全位置の活性を全層で平均し、この数の位置に平均プーリングしたものを表現とする
  num_state_queries: 100
  # プーリングした位置ごとに射影する幅。状態の幅は num_state_queries * state_out_dim
  state_out_dim: 4

actor_critic:
  seq_len: 50
  image_encoder_type: qwen  # [taesd, dinov2, siglip2, vjepa2, qwen]
  image_encoder_output_dim: 16
  disable_state_predictor: false
  encoder_block_num: 8
  temporal_model_type: gdn
  layer_scale_init: 0.0001
  token_dropout: 0.0
  # 学習時に系列ごとに 0 からこの数までの一様なステップ数を引き、最新の方からその数の
  # ステップの観測（画像・報酬・スカラー）を落とす。行動は落とさない
  observation_drop_steps_max: 0
