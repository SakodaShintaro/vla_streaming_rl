# @package _global_
weight_decay: 0.01

prediction_head:
  _target_: vla_streaming_rl.networks.modules.prediction_head.StatePredictionHead
  _partial_: true
  predictor_hidden_dim: 512
  predictor_block_num: 2
  predictor_type: flow_matching  # [flow_matching, mean_flow]

value_head:
  _target_: vla_streaming_rl.networks.build._build_value_head
  _partial_: true
  critic_arch: dueling  # [dueling, simbav2]
  horizon: ${horizon}
  gamma: ${gamma}
  multi_gammas: ${multi_gammas}
  hidden_dim: 1024
  block_num: 1
  num_bins: 1
  sparsity: ${sparsity}
  detach_state: false

policy_head:
  _target_: vla_streaming_rl.networks.modules.policy_head.build_policy_head
  _partial_: true
  policy_type: tanh
  hidden_dim: 512
  block_num: 1
  horizon: ${horizon}
  sparsity: ${sparsity}
  denoising_time: 0.9
  denoising_steps: 1
  dacer_loss_weight: 0.05
  target_entropy_scale: 1.0
  init_temperature: 0.01
  temperature_lr: 3e-3
  detach_state: true

high_level:
  model_id: Qwen/Qwen3.8-27B
  load_in_4bit: true
  max_new_tokens: 128
  temperature: 0.5
  reasoning_max_tokens: 0
  # 全注意層の KV を「先頭の sink ＋直近この数のトークン」まで間引く
  window_tokens: 16384
  cot_mode: batch  # [batch, stream]
  cot_tokens_num: 0
  # batch ではチェーンを確定して行動を読む間隔。stream では書き終えたステップで確定し、
  # この長さで書き終わらなければ残りを書き切って確定する
  cot_steps_per_chain: 16
  # stream で、書きかけのチェーンに最新の画像を差し込んで書き進める間隔
  cot_steps_per_image: 16
  # stream で、各ステップに書き進めるトークン数。返答の長さ / これ が確定の間隔になる
  cot_write_tokens_per_step: 2
  # 高レベル方策が会話として読む窓のステップ数。cot_steps_per_chain ステップごとに1回の
  # やり取りなので、履歴は (seq_len - 1) // cot_steps_per_chain 回分になる。
  # また、実際に読める長さは window_tokens で頭打ちになる
  seq_len: 8193

vla:
  # リプレイバッファから読む時間窓のステップ数
  seq_len: 1
  model_id: Qwen/Qwen3.5-0.8B
  load_in_4bit: true
  use_lora: false
  num_state_queries: 100
  state_out_dim: 4
  reasoning_loss_weight: 1.0
  reasoning_max_tokens: 0
  reasoning_temperature: 1.0

actor_critic:
  seq_len: 1
  image_encoder_type: qwen  # [taesd, dinov2, siglip2, vjepa2, qwen]
  image_encoder_output_dim: 16
  detach_predictor: false
  disable_state_predictor: false
  encoder_block_num: 8
  temporal_model_type: gru
  layer_scale_init: 0.0001
  cot_dropout: 0.5
  token_dropout: 0.0
  bc_loss_weight: 0.0
  cot_pool: mean  # [mean, none]
