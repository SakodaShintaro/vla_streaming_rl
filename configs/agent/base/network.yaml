# @package _global_
encoder_block_num: 8
temporal_model_type: gru
layer_scale_init: 0.0001
weight_decay: 0.01
# Image encoder: taesd, dinov2, siglip2, vjepa2, qwen (see IMAGE_ENCODERS in image_processor.py).
image_encoder_type: qwen
# Trainable 1x1 conv projects the (frozen) backbone's channel dim down to this.
image_encoder_output_dim: 16
predictor_hidden_dim: 512
predictor_block_num: 2
predictor_step_num: 1
predictor_type: flow_matching
detach_actor: true
detach_critic: false
detach_predictor: false
disable_state_predictor: false

# Chain-of-thought stream. A frozen VLM keeps
# one chain of thought running across environment steps: cot_tokens_num tokens
# are generated per step and the activations feeding its lm_head join the
# encoder's space axis. The chain restarts from the current frame on EOS or
# after max_new_tokens tokens, which is when the VLM reads a new image at all.
# 0 = no chain, which is the plain actor-critic and the ablation a
# chain-carrying run is measured against. The cot_* agent configs turn it on.
cot_tokens_num: 0
# When the VLM runs, which is what decides how fresh the chain is and how
# much of a control tick it costs.
#   stream : one chain kept mid-thought, cot_tokens_num tokens issued per
#            step, so every step pays a slice of it and the chain is always
#            partly written (cot_steps_per_chain is ignored).
#   batch  : a whole chain written every cot_steps_per_chain steps and held
#            in between, so what the agent reads is a finished thought about
#            a frame up to that many ticks old.
cot_mode: batch
cot_steps_per_chain: 16
# Share of learning batches the chain is taken away from, so the critic is
# calibrated on states with and without one and the gap between them means
# something. 0 leaves the chain in every batch, which is the ablation.
cot_dropout: 0.5
token_dropout: 0.2
bc_loss_weight: 0.0
# How a step's chain tokens reach the space axis.
#   mean : one slot per step, whose temporal recurrence follows the chain
#   none : one slot per token, each recurring on a stride-L phase of the chain
cot_pool: mean
# Record the decode step as a CUDA graph and replay it. At batch 1 the step is
# ~2500 tiny kernels and the host spends longer issuing them than the GPU does
# running them, so replaying one call is several times faster. Off falls back to
# issuing the step normally.
cot_cuda_graph: true

value_head:
  _target_: vla_streaming_rl.networks.build._build_value_head
  _partial_: true
  critic_arch: dueling  # [dueling, simbav2]
  horizon: ${horizon}
  gamma: ${gamma}
  multi_gammas: ${multi_gammas}
  hidden_dim: 1024
  block_num: 1
  num_bins: 1
  sparsity: ${sparsity}

policy_head:
  _target_: vla_streaming_rl.networks.modules.policy_head.build_policy_head
  _partial_: true
  policy_type: tanh
  hidden_dim: 512
  block_num: 1
  horizon: ${horizon}
  sparsity: ${sparsity}
  denoising_time: 0.9
  denoising_steps: 1
  dacer_loss_weight: 0.05
  target_entropy_scale: 1.0
  init_temperature: 0.01
  temperature_lr: 3e-3

chain_generator:
  _target_: vla_streaming_rl.networks.modules.chain_generator.ChainGenerator
  _partial_: true
  model_id: ${vlm_model_id}
  load_in_4bit: ${vlm_load_in_4bit}
  max_len: ${max_new_tokens}
  temperature: ${temperature}
  window_tokens: 8192

use_lora: false
vlm_model_id: Qwen/Qwen3.8-27B
vlm_load_in_4bit: true
num_state_queries: 100
state_out_dim: 4
max_new_tokens: 128
temperature: 0.5
max_prompt_tokens: 512
pad_token_id: 0
reasoning_loss_weight: 1.0
reasoning_max_tokens: 0
reasoning_temperature: 1.0
