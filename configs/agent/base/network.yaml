# @package _global_
weight_decay: 0.01

prediction_head:
  _target_: vla_streaming_rl.networks.modules.prediction_head.StatePredictionHead
  _partial_: true
  predictor_hidden_dim: 512
  predictor_block_num: 2
  predictor_type: flow_matching  # [flow_matching, mean_flow]

value_head:
  _target_: vla_streaming_rl.networks.build._build_value_head
  _partial_: true
  critic_arch: dueling  # [dueling, simbav2]
  horizon: ${horizon}
  gamma: ${gamma}
  multi_gammas: ${multi_gammas}
  hidden_dim: 1024
  block_num: 1
  num_bins: 1
  sparsity: ${sparsity}
  detach_state: false

policy_head:
  _target_: vla_streaming_rl.networks.modules.policy_head.build_policy_head
  _partial_: true
  policy_type: tanh
  hidden_dim: 512
  block_num: 1
  horizon: ${horizon}
  sparsity: ${sparsity}
  denoising_time: 0.9
  denoising_steps: 1
  dacer_loss_weight: 0.05
  target_entropy_scale: 1.0
  init_temperature: 0.01
  temperature_lr: 3e-3
  detach_state: true

high_level:
  model_id: Qwen/Qwen3.5-9B
  load_in_4bit: false
  max_new_tokens: 128
  temperature: 0.5
  # 返答の強化学習（LoRA）の学習率。0 なら高レベル方策は凍結したまま
  learning_rate: 1e-4
  # 全注意層の KV を「先頭の sink ＋直近この数のトークン」まで間引く
  window_tokens: 16384
  subtask_tokens_num: 0
  # チェーンを書いて確定し、行動を読む間隔
  steps_per_reply: 16
  # 高レベル方策が会話として読む窓のステップ数。steps_per_reply ステップごとに1回の
  # やり取りなので、履歴は (seq_len - 1) // steps_per_reply 回分になる。
  # また、実際に読める長さは window_tokens で頭打ちになる
  seq_len: 8193

vla:
  # リプレイバッファから読む時間窓のステップ数
  seq_len: 1
  model_id: Qwen/Qwen3.5-0.8B
  load_in_4bit: true
  use_lora: false
  num_state_queries: 100
  state_out_dim: 4

actor_critic:
  seq_len: 1
  image_encoder_type: qwen  # [taesd, dinov2, siglip2, vjepa2, qwen]
  image_encoder_output_dim: 16
  detach_predictor: false
  disable_state_predictor: false
  encoder_block_num: 8
  temporal_model_type: gru
  layer_scale_init: 0.0001
  subtask_dropout: 0.1
  token_dropout: 0.0
  bc_loss_weight: 0.0
  subtask_pool: none  # [mean, none]
