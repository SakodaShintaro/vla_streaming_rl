# @package _global_
weight_decay: 0.01

prediction_head:
  _target_: vla_streaming_rl.networks.modules.prediction_head.StatePredictionHead
  _partial_: true
  predictor_hidden_dim: 512
  predictor_block_num: 2
  predictor_type: flow_matching  # [flow_matching, mean_flow]

value_head:
  _target_: vla_streaming_rl.networks.build._build_value_head
  _partial_: true
  critic_arch: dueling  # [dueling, simbav2]
  horizon: ${horizon}
  gamma: ${gamma}
  multi_gammas: ${multi_gammas}
  hidden_dim: 1024
  block_num: 1
  num_bins: 1
  sparsity: ${sparsity}
  detach_state: false

policy_head:
  _target_: vla_streaming_rl.networks.modules.policy_head.build_policy_head
  _partial_: true
  policy_type: tanh
  hidden_dim: 512
  block_num: 1
  horizon: ${horizon}
  sparsity: ${sparsity}
  denoising_time: 0.9
  denoising_steps: 1
  dacer_loss_weight: 0.05
  target_entropy_scale: 1.0
  init_temperature: 0.01
  temperature_lr: 3e-3
  detach_state: true

vla:
  # 会話に残すステップ数。今のステップと、その前の seq_len - 1 回のやり取り。
  # 会話はリプレイバッファのこの数の行から組み直す
  seq_len: 8
  model_id: Qwen/Qwen3.5-0.8B
  load_in_4bit: true
  use_lora: false
  num_state_queries: 100
  state_out_dim: 4
  # 毎ステップ書く返答（サブタスク・行動）の生成
  max_new_tokens: 512
  # 思考の量。none なら思考を閉じて返答だけを書く。low / medium / xhigh はテンプレートの
  # reasoning_effort で、思考を書いてから返答する（max_new_tokens も思考込み）
  reasoning_effort: low
  temperature: 0.5
  # 返答の行動と頭の行動を行動価値で選ぶときの余裕。頭の行動の価値が返答の行動を
  # これより大きく上回るときだけ頭の行動を実行する。.inf なら常に返答の行動、
  # -.inf なら常に頭の行動（バッファを貯めている間は常に返答の行動）
  select_margin: 0.0

actor_critic:
  seq_len: 1
  image_encoder_type: qwen  # [taesd, dinov2, siglip2, vjepa2, qwen]
  image_encoder_output_dim: 16
  detach_predictor: false
  disable_state_predictor: false
  encoder_block_num: 8
  temporal_model_type: gru
  layer_scale_init: 0.0001
  token_dropout: 0.0
  # 学習時に系列ごとに 0 からこの数までの一様なステップ数を引き、最新の方からその数の
  # ステップの観測（画像・報酬・スカラー）を落とす。行動は落とさない
  observation_drop_steps_max: 0
