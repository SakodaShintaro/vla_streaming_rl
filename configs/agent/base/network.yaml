# @package _global_
weight_decay: 0.01
# Image encoder: taesd, dinov2, siglip2, vjepa2, qwen (see IMAGE_ENCODERS in image_processor.py).
image_encoder_type: qwen
# Trainable 1x1 conv projects the (frozen) backbone's channel dim down to this.
image_encoder_output_dim: 16
predictor_step_num: 1
detach_actor: true
detach_critic: false
detach_predictor: false
disable_state_predictor: false

prediction_head:
  _target_: vla_streaming_rl.networks.modules.prediction_head.StatePredictionHead
  _partial_: true
  predictor_hidden_dim: 512
  predictor_block_num: 2
  predictor_type: flow_matching  # [flow_matching, mean_flow]

cot_module:
  _target_: vla_streaming_rl.networks.actor_critic_with_action_value.build_cot
  _partial_: true
  mode: batch  # [batch, stream]
  model_id: ${high_level.model_id}
  load_in_4bit: ${high_level.load_in_4bit}
  tokens_per_step: ${high_level.cot_tokens_num}
  max_len: ${high_level.max_new_tokens}
  temperature: ${high_level.temperature}
  steps_per_chain: ${high_level.cot_steps_per_chain}
  chain_generator_factory: ${chain_generator}

value_head:
  _target_: vla_streaming_rl.networks.build._build_value_head
  _partial_: true
  critic_arch: dueling  # [dueling, simbav2]
  horizon: ${horizon}
  gamma: ${gamma}
  multi_gammas: ${multi_gammas}
  hidden_dim: 1024
  block_num: 1
  num_bins: 1
  sparsity: ${sparsity}

policy_head:
  _target_: vla_streaming_rl.networks.modules.policy_head.build_policy_head
  _partial_: true
  policy_type: tanh
  hidden_dim: 512
  block_num: 1
  horizon: ${horizon}
  sparsity: ${sparsity}
  denoising_time: 0.9
  denoising_steps: 1
  dacer_loss_weight: 0.05
  target_entropy_scale: 1.0
  init_temperature: 0.01
  temperature_lr: 3e-3

chain_generator:
  _target_: vla_streaming_rl.networks.modules.chain_generator.ChainGenerator
  _partial_: true
  model_id: ${high_level.model_id}
  load_in_4bit: ${high_level.load_in_4bit}
  max_len: ${high_level.max_new_tokens}
  temperature: ${high_level.temperature}
  window_tokens: 8192

max_prompt_tokens: 512
pad_token_id: 0

high_level:
  model_id: Qwen/Qwen3.8-27B
  load_in_4bit: true
  max_new_tokens: 128
  temperature: 0.5
  reasoning_max_tokens: 0
  cot_tokens_num: 0
  cot_steps_per_chain: 16

vla:
  model_id: Qwen/Qwen3.5-0.8B
  load_in_4bit: true
  use_lora: false
  num_state_queries: 100
  state_out_dim: 4
  reasoning_loss_weight: 1.0
  reasoning_max_tokens: 0
  reasoning_temperature: 1.0

actor_critic:
  encoder_block_num: 8
  temporal_model_type: gru
  layer_scale_init: 0.0001
  cot_dropout: 0.5
  token_dropout: 0.2
  bc_loss_weight: 0.0
  cot_pool: mean  # [mean, none]
