# @package _global_
defaults:
  - base/network
  - base/off_policy
  - base/streaming
  - base/vlm
  - _self_

agent_type: zeroshot_vlm
# This baseline acts by writing the action out and decoding it with the env's
# parse_action_text, so it runs the text-action prompt regime (agents/prompt.py).
text_action_mode: text_action
# Where generation runs:
#   openrouter : a hosted model, one API call per env step (`openrouter_model_id`).
#   local      : a Qwen3.5 checkpoint generating in this process on the GPU
#                (`vlm_model_id`, from base/vlm), so no API key and no server.
vlm_backend: openrouter
# OpenRouter model
# model                                               context   $in/Mtok  $out/Mtok
# qwen/qwen3.7-flash                                1,000,000      0.030      0.130
# qwen/qwen3.5-flash-02-23                          1,000,000      0.065      0.260
# qwen/qwen3.5-9b                                     262,144      0.100      0.150
# qwen/qwen3.6-35b-a3b                                262,144      0.150      1.000
# qwen/qwen3.6-flash                                1,000,000      0.188      1.125
# qwen/qwen3.5-27b                                    262,144      0.195      1.560
# qwen/qwen3.5-35b-a3b                                262,144      0.225      1.800
# qwen/qwen3.5-plus-02-15                           1,000,000      0.260      1.560
# qwen/qwen3.5-122b-a10b                              262,144      0.290      2.400
# qwen/qwen3.5-plus-20260420                        1,000,000      0.300      1.800
# qwen/qwen3.7-plus                                 1,000,000      0.320      1.280
# qwen/qwen3.6-plus                                 1,000,000      0.325      1.950
# qwen/qwen3.5-397b-a17b                              262,144      0.390      2.340
# qwen/qwen3.8-27b                                    262,144      0.450      3.200
# qwen/qwen3.6-27b                                    262,144      0.600      3.600
# qwen/qwen3.8-max                                  1,000,000      2.000      6.000
openrouter_model_id: qwen/qwen3.7-flash
# Response budget, on both backends: the reply is the <think> section and the
# <answer> that follows it, and a local generation stops at </answer> rather
# than spending the rest.
max_new_tokens: 128
# The model's own hidden thinking: a cap on OpenRouter's `reasoning`, and on the
# local backend the switch the chat template's own block reads. The prompt already asks for the chain
# of thought inside <think>, so the hidden copy only competes for max_new_tokens:
# with no cap the budget runs out before <answer> and the response comes back
# empty. 0 disables thinking entirely.
reasoning_max_tokens: 0
temperature: 0.5
# Retries the OpenAI SDK makes per request (exponential backoff). A run is one
# API call per env step, so an upstream 429 / 5xx must not abort it.
api_max_retries: 16
