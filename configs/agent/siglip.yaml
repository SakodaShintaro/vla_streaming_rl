# @package _global_
defaults:
  - /policy_head: tanh
  - /value_head: token_dueling  # [dueling, token_dueling, simbav2]
  - /prediction_head: td_jepa
  - _self_

# この設定のエージェント（build.py が組み立てるネットワークとエージェントを選ぶ）
agent_type: siglip
batch_size: 16
actor_lr: 1e-5
critic_lr: 1e-5
weight_decay: 0.01
# siglip.num_gdn_layers > 0 のとき、GDN の層の LoRA を最新のステップの streaming の更新で RTRL で学ぶか。
# LoRA の学習率と1次のモーメント
streaming_update: false
lora_lr: 1e-5
lora_beta1: 0.999

replay_buffer:
  # 表現が 1 ステップ 64 x 768（bfloat16 で 96KB）なので GPU に置く（size 20000 で約 2GB）
  device: cuda

siglip:
  # 画像を読む凍結した SigLIP2 の画像の塔。パッチ 16 で格子 16x16、token_pool 2 で 8x8 = 64 トークン
  model_id: google/siglip2-base-patch16-256
  # SigLIP2 に入れる画像の一辺。位置の埋め込みが固定なので model_id の解像度と同じにする
  resolution: 256
  # パッチの格子を平均でまとめる幅。2 なら 8x8 = 64 トークン（VLM の 256px の画像と同じ数）
  token_pool: 2
  # 位置ごとに射影する幅。スカラーの観測も1つずつこの幅のトークンにする
  token_dim: 64
  # スカラーをトークンにする sin/cos の周期の範囲
  scalar_min_period: 0.5
  scalar_max_period: 4096.0
  # ステップごとにトークンどうしを混ぜる Transformer の層の数、注意のヘッドの数、残差の layer scale の初期値
  token_mixer_layers: 2
  token_mixer_heads: 4
  token_mixer_layer_scale_init: 0.0001
  # ステップのトークンを潜在のトークンにまとめて読み、再帰の状態をステップをまたいで持ち越す GDN の
  # 層の数（0 なら置かない）。幅は token_dim。元の重みはリプレイの窓の BPTT で学ぶ
  num_gdn_layers: 0
  # ステップのトークンを Perceiver のプーリングでまとめる潜在のトークンの数。GDN の層の出力は
  # 記憶のトークンとして混ぜる層の入力に付け足す
  gdn_memory_tokens: 8
  # 1ステップを読む間の再帰の状態の減衰の初期値の範囲（ヘッドごとにこの間に散らす）
  gdn_step_decay_min: 0.5
  gdn_step_decay_max: 0.99
  gdn_heads: 4
  gdn_head_dim: 32
  gdn_mlp_dim: 256
  # streaming_update で学ぶ LoRA のランクと alpha
  gdn_lora_rank: 8
  gdn_lora_alpha: 16.0
  # リプレイの窓。保存した再帰の状態から burn-in のステップを勾配なしで読み、続く BPTT のステップの
  # 最後を現在の状態にする
  gdn_burn_in_steps: 8
  gdn_bptt_steps: 8
  # advantage learning の係数。critic の TD の目標から alpha (V(s) - Q(s, a)) を引き、方策の行動と
  # それ以外の行動の価値の差（action gap）を広げる。0 なら引かない
  advantage_learning_alpha: 0.9
