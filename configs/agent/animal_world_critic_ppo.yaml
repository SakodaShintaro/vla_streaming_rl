# @package _global_
defaults:
  - base/network
  - base/off_policy
  - base/streaming
  - base/vlm
  - _self_

agent_type: animal_world_critic_ppo
network_class: animal_world_critic
learning_mode: on_policy

steps_num: 256
minibatch_size: 64
mini_epochs: 4
# Every unrolled window of n steps gives n - 1 next-state pairs, so seq_len is
# what decides how much the world-critic loss sees; the plain PPO config's 2 is
# the bare minimum.
seq_len: 8
lam: 0.9
learning_rate: 1e-4
e_clip: 0.2
entropy_coef: 0.01
critic_coef: 1.0
clip_value: 1
normalize_advantage: 1
max_grad_norm: 0.5

velocity_scale: [1.0, 1.0, 16.0]
health_scale: 100.0

reward_bonus: 0.5
ramps_coef: 0.01
back_move_coef: 0.001

use_prompt: 0
use_feedback: 0
learning_starts: 0
buffer_size: 0
