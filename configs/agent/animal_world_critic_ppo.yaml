# @package _global_
# The Animal-AI PPO agent with WCM's world-critic objective (ported from
# ~/work/WCM): the same recurrent PPO as agent=animal_ppo, plus an
# action-conditioned next-latent prediction and the SIGReg collapse guard on the
# shared representation.
agent_type: animal_world_critic_ppo
network_class: animal_world_critic
learning_mode: on_policy

steps_num: 256
minibatch_size: 64
mini_epochs: 4
# Every unrolled window of n steps gives n - 1 next-state pairs, so seq_len is
# what decides how much the world-critic loss sees; the plain PPO config's 2 is
# the bare minimum.
seq_len: 8
lam: 0.9
learning_rate: 1e-4
e_clip: 0.2
entropy_coef: 0.01
critic_coef: 1.0
clip_value: 1
normalize_advantage: 1
max_grad_norm: 0.5

# The world-critic branch. latent_dim / dynamics_depth follow WCM's defaults
# scaled to this much smaller encoder; the loss weights are WCM's
# next_state_weight and sigreg_weight.
wcm_latent_dim: 256
wcm_dynamics_depth: 3
wcm_dynamics_mlp_ratio: 4.0
wcm_dynamics_dropout: 0.1
wcm_next_state_coef: 0.1
wcm_sigreg_coef: 0.01
wcm_sigreg_knots: 17
wcm_sigreg_projections: 1024

velocity_scale: [1.0, 1.0, 16.0]
health_scale: 100.0

reward_bonus: 0.5
ramps_coef: 0.01
back_move_coef: 0.001

use_prompt: 0
use_feedback: 0
learning_starts: 0
buffer_size: 0
