# @package _global_
defaults:
  - base/network
  - base/off_policy
  - base/streaming
  - base/vlm
  - _self_

agent_type: off_policy
network_class: actor_critic_with_action_value
batch_size: 16
actor_lr: 1e-5
critic_lr: 1e-5

# The chain-carrying run of the one actor-critic. Setting cot_tokens_num back to
# 0 is its ablation: same body, same heads, same loss, no chain on the space axis.
cot_tokens_num: 4
cot_max_len: 128
cot_carry_prev: true
cot_history_frames: 4
cot_history_stride: 4
disable_state_predictor: 1
