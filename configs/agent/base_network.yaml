# @package _global_
encoder_block_num: 1
actor_hidden_dim: 512
actor_block_num: 1
critic_hidden_dim: 1024
critic_block_num: 1
# Action-value critic architecture:
#   simbav2 : SimbaV2 hyperspherical critic (arXiv:2502.15280); weights and
#             features stay on the unit hypersphere so the TD loss cannot blow
#             up the critic norm.
#   dueling : original LayerNorm dueling V/A critic.
critic_arch: dueling
# Image encoder: taesd, wan, dinov2, siglip2, vjepa2 (see IMAGE_ENCODERS in image_processor.py).
image_encoder_type: dinov2
# Trainable 1x1 conv projects the (frozen) backbone's channel dim down to this.
image_encoder_output_dim: 16
predictor_hidden_dim: 512
predictor_block_num: 2
predictor_step_num: 1
predictor_type: flow_matching
num_bins: 1
detach_actor: 1
detach_critic: 0
detach_predictor: 0
disable_state_predictor: 0
dacer_loss_weight: 0.05
denoising_steps: 1
som_alpha: 1.0
som_w: 25.0
