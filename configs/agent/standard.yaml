# @package _global_
# Unified standard agent. The defaults below match the former vlm_streaming
# config (VLM actor-critic, streaming). Reproduce the other former configs with
# command-line overrides on scripts/train.py:
#   cnn_off_policy_bs16 : network_class=actor_critic_with_action_value learning_mode=off_policy batch_size=16 actor_lr=1e-5 critic_lr=1e-5
#   cnn_streaming       : network_class=actor_critic_with_action_value learning_mode=streaming
#   vlm_off_policy_bs1  : learning_mode=off_policy batch_size=1 actor_lr=2e-6 critic_lr=2e-6
#   vlm_off_policy_bs16 : learning_mode=off_policy batch_size=16 actor_lr=1e-5 critic_lr=1e-5
#   vlm_streaming       : (defaults, no override)
defaults:
  - base_network
  - base_off_policy
  - base_streaming
  - base_vlm
  - _self_

agent_type: standard
network_class: vlm_actor_critic_with_action_value
learning_mode: streaming
batch_size: 1
actor_lr: 1e-6
critic_lr: 1e-6
