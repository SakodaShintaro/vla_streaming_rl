# @package _global_
defaults:
  - /policy_head: tanh
  - /value_head: token_dueling  # [dueling, token_dueling, simbav2]
  - /prediction_head: td_jepa
  - _self_

# この設定のエージェント（build.py が組み立てるネットワークとエージェントを選ぶ）
agent_type: wan
batch_size: 16
actor_lr: 1e-5
critic_lr: 1e-5
weight_decay: 0.01

replay_buffer:
  # 表現が 1 ステップ 64 x 256（bfloat16 で 32KB）なので GPU に置く（size 20000 で約 650MB）
  device: cuda

wan:
  # 元の形式の重み（VAE だけ使う）。diffusers_id は diffusers の設定ファイルだけを読む
  model_id: Wan-AI/Wan2.1-T2V-1.3B
  diffusers_id: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  # 潜在をトークンに分けるときに、1 つのトークンが受け持つ潜在の縦横の画素数。
  # 256px の画像の潜在は 32x32 の格子で各画素 16 チャネル。4 にすると 32x32 を 4x4 ずつに
  # 区切るのでトークンは 8x8 = 64 個になり、各トークンは 4x4 画素 x 16 チャネル = 256 個の
  # 値を並べたベクトルになる
  latent_patch: 4
  # 位置ごとに射影する幅。スカラーの観測も1つずつこの幅のトークンにする
  token_dim: 64
  # スカラーをトークンにする sin/cos の周期の範囲
  scalar_min_period: 0.5
  scalar_max_period: 4096.0
  # ステップごとにトークンどうしを混ぜる Transformer の層の数、注意のヘッドの数、残差の layer scale の初期値
  token_mixer_layers: 2
  token_mixer_heads: 4
  token_mixer_layer_scale_init: 0.0001
