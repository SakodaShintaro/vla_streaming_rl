# @package _global_
# Cosmos3-Edge backbone + new `navigation` action domain on CARLA.
#
# The Cosmos3-Edge trunk (und/gen streams) and WanVAE are frozen; the policy is
# a NEW embodiment domain `navigation` (free DomainAwareLinear slot 31, raw dim
# 2 = [steer, gas_or_brake]) whose projection rows (+ shared action modality
# embed) are the only actor parameters, plus the injected action-value critic.
# The action row IS the env control — no trajectory/PID conversion — so the
# same action space can later serve other envs (Animal-AI) via frame_stride.
#
# Learning (see networks/cosmos_edge_network.py):
#   * Critic — TD bootstrap over the chunk_size-step reward window on the
#     executed control rows; bootstrap action sampled from the policy itself.
#     State = pooled backbone understanding stream (2048-D).
#   * Actor — DACER2: advantage maximization -E[Q(s, pi(s))] through the
#     differentiable action denoiser, plus a Q-gradient-guided flow-matching term.
#
# The Cosmos3-Edge checkpoint is pulled from the HF hub on first use.
defaults:
  - base_network
  - base_off_policy
  - base_streaming
  - base_vlm
  - _self_

agent_type: cosmos_edge
network_class: cosmos_edge
learning_mode: off_policy
batch_size: 1
# The actor trains freshly-initialized projection rows (not pretrained heads),
# so the learning rates are conventional; tune down if unstable.
actor_lr: 1e-4
critic_lr: 1e-4

image_save_interval: 50
print_interval: 1
learning_starts: 800
buffer_size: 4000

# `chunk_size` is the number of generated future control rows the agent
# executes open-loop per plan AND the critic's reward window (horizon) — one
# knob. The model's joint sequence additionally carries future_start = 4
# anchored history rows, so it holds future_start + chunk_size = 12 rows
# (num_frames = 13 -> 4 latent frames; the total must be a multiple of 4).
# Model frames are action_fps = 10 Hz while CARLA ticks at 20 Hz, so one row
# spans frame_stride = 2 env ticks (Animal-AI at 50 Hz would use 5); the
# replay stores one slot per model frame.
chunk_size: 8
horizon: ${chunk_size}
num_cond_latent_frames: 2
action_fps: 10.0
frame_stride: 2

# Cosmos3-Edge knobs. The navigation prompt is built by the CARLA env
# (route command -> maneuver sentence) and delivered via obs["language"].
resolution_tier: 480
num_inference_steps: 4
actor_denoising_steps: 1
q_grad_eta: 0.05
dacer_loss_weight: 0.05
