# @package _global_
env_id: CARLA-Leaderboard-v0
step_limit: 500_000
render_scale: 0.33

env_factory:
  _target_: vla_streaming_rl.wrappers.make_carla_env
  # - route_id: optional, restrict to one specific route id from the XML.
  #   Only valid with sequence_mode='random'. null means "pick a random
  #   route from the XML each episode".
  # - sequence_mode: 'random' (legacy: random pick each reset, single-town
  #   XML only) or 'sequential' (walk routes in **town-grouped** order
  #   starting at start_index; town flips only at block boundaries to
  #   minimize ~30 s Town12/13 reloads). 'sequential' is the bench2drive220
  #   driver.
  # - start_index: 0-indexed cursor for sequential mode (indexes into the
  #   town-sorted config list, not raw XML order). Use this to resume
  #   from a specific position (e.g. after a crash).
  # - loop: when true (sequential only), wraps the cursor back to 0
  #   after the last config so training continues indefinitely. Leave
  #   false for the Bench2Drive220 fixed-sweep usage. In random mode
  #   the flag is a no-op (random never exhausts).
  # - early_off_route_m: tighter analogue of Bench2Drive's InRouteTest
  #   (30 m). When set, the env terminates as soon as the distance to
  #   the closest route waypoint exceeds this. null disables it (only
  #   the upstream 30 m criterion applies).
  # - early_blocked_steps: tighter analogue of Bench2Drive's
  #   AgentBlockedTest (60 s = 1200 steps @ 20 FPS under 0.1 m/s).
  #   Terminates after this many consecutive sub-0.1 m/s steps. null
  #   disables it.
  route_id: null
  sequence_mode: sequential
  start_index: 0
  loop: true
  early_off_route_m: null
  early_blocked_steps: null
