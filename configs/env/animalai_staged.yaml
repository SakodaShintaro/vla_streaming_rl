# @package _global_
env_id: AnimalAI-v0
# 9 stage transitions at steps_per_stage each (18M), then the 10th (final,
# all-levels) stage runs for the rest of step_limit (7M): matches the paper's
# 2M x 10 + 5M-extra = 25M-step schedule (see AnimalAIStagedEnv docstring).
step_limit: 25_000
image_save_interval: 20

# Staged curriculum reproducing the Animal-AI Environment paper's Testbed
# protocol (Section 4.1.3): 10 cumulative stages, each looping over
# `train_variant_count` of the 3 variants per task. The held-out variants
# (and, with train_variant_count=1, two thirds of the Testbed) are only ever
# seen by the frozen-policy 900-arena eval sweep (scripts/test_trained_agent.py).
env_factory:
  _target_: vla_streaming_rl.wrappers.make_animalai_staged_env
  # - resolution: square camera height/width (kept divisible by the VAE stride 8).
  resolution: 96
  # - train_variant_count: how many of each task's 3 variants are trained on (1 or 2).
  train_variant_count: 1
  steps_per_stage: 2_000
