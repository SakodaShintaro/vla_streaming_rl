# @package _global_
env_id: LIBERO-v0
step_limit: 200_000
image_save_interval: 10
time_limit_hour: 2.0

env_factory:
  _target_: vla_streaming_rl.wrappers.make_libero_env
  # - task_suite_name: libero_spatial / libero_object / libero_goal /
  #   libero_90 / libero_10.
  # - task_id: index of the task within the suite, or -1 to draw a fresh
  #   task on every reset (whole-suite training).
  # - resolution: square camera height/width (kept divisible by the VAE stride).
  # - settle_steps: zero-action steps after set_init_state to settle physics.
  # - horizon: max controllable steps before truncation.
  # - perturb_robot_joint_std: LIBERO-PRO-style initial-state perturbation
  task_suite_name: libero_object
  task_id: 0
  resolution: 256
  settle_steps: 10
  horizon: 300
  perturb_robot_joint_std: 0.10
