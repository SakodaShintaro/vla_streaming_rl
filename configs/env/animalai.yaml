# @package _global_
env_id: AnimalAI-v0
# Only bounds the two training modes. "eval" instead ends when all 900 arenas
# have run (scripts/test_trained_agent.py loops until the env is exhausted).
# For "staged": stages 1-10 take steps_per_stage each and stage 11 runs out the
# remainder, so the paper's 2M x 10 + 5M = 25M is step_limit == 12.5 x
# steps_per_stage; the values below keep that ratio at 1/1000 scale.
step_limit: 400_000
image_save_interval: 40

env_factory:
  _target_: vla_streaming_rl.wrappers.make_animalai_env
  # - resolution: square camera height/width (kept divisible by the VAE stride 8).
  resolution: 96
  # - mode: which arenas each episode is drawn from, and in what order.
  #     staged  : train with the Animal-AI paper's cumulative 11-stage
  #               curriculum, one stage per competition level, drawing
  #               uniformly from the arenas the stage has unlocked.
  #     success : the same stages, but a stage opens the next one once all of
  #               its arenas have been passed (steps_per_stage is ignored);
  #               odd trials draw uniformly from the stage's still-unsolved
  #               arenas, even trials from every arena unlocked so far by a
  #               softmax over their failure rates.
  #     sequential : no curriculum. Every training arena in label order,
  #               wrapping back to the first once the last has run, until
  #               step_limit (steps_per_stage is ignored).
  #     random  : no curriculum. Every episode draws uniformly at random from
  #               the whole training set, with no ordering and nothing
  #               withheld (steps_per_stage is ignored).
  #     eval    : run each of the 900 external/animal-ai/configs/competition/
  #               arenas once, in order (the paper's Testbed protocol).
  #   Training and eval overlap on purpose: eval is the fixed 900-arena
  #   benchmark and the trained variant is part of it, so test_result.tsv also
  #   reports the score over the arenas no training episode has seen.
  mode: success
  # - train_variant: which of a task's three variants the training modes use.
  #   Competition arenas are named XX-YY-ZZ (level-task-variant), so this picks
  #   one arena per task: 300 arenas, 30 per level. "eval" ignores it and
  #   always sweeps all 900.
  train_variant: "01"
  # - steps_per_stage ("staged"): how long each of the 11 stages lasts.
  steps_per_stage: 40_000
  # - revisit_temperature ("success"): temperature of the even-trial failure
  #   rate softmax; < 1 sharpens it towards the worst arenas, > 1 flattens it
  #   towards uniform
  revisit_temperature: 1.0
  binary_path: ~/animalai_env/4.3.2_alpha1/Linux/animalAI.x86_64
  # - continuous_action: how Unity consumes the Box(-1, 1, (2,)) action.
  #     false : discretize to the official MultiDiscrete([3, 3]) branches with a
  #             +/-1/3 dead-zone. Works with any Animal-AI binary.
  #     true  : pass the value through as a throttle / turn rate. Requires a
  #             binary rebuilt from animal-ai-unity with the hybrid action spec
  #             (branch "feat/continuous_actions"); +/-1 there matches the discrete
  #             branches exactly, so it is a strict superset of false.
  continuous_action: false
  # - topdown_camera: have the binary render a second camera looking straight
  #   down at the whole arena. It never reaches the policy (it is not part of
  #   observation_space); `render` draws it in the pane the schematic would have
  #   filled, so a run can be watched as it happens. Costs roughly a quarter of
  #   the environment's throughput, so turn it off for runs nobody is watching.
  #   Ignored by an official binary.
  topdown_camera: true
  # - topdown_resolution: that camera's square resolution, independent of
  #   `resolution` since only a human looks at it. Cost grows with the pixel
  #   count, so this is the knob to turn when the view is too slow or too coarse.
  topdown_resolution: 96
  # - end_at_pass_mark: end the episode once a collected reward reaches the
  #   arena's pass mark. Unity never does, so in an arena with no episode-ending
  #   goal the agent bleeds 1/t per step until its health expires -- 1.0 of
  #   return, enough to drop a passing score back under the mark. Applies to
  #   eval too, so the Testbed score is not the 2019 competition's.
  end_at_pass_mark: true
