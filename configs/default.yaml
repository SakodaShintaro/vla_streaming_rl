defaults:
  - _self_
  - agent: vla_streaming
  - env: car_racing

hydra:
  run:
    dir: ${result_dir}/${now:%Y%m%d_%H%M%S}_${hydra:runtime.choices.agent}_${exp_name}
  sweep:
    dir: ${result_dir}
    subdir: ${now:%Y%m%d_%H%M%S}_${hydra:runtime.choices.agent}_${exp_name}

exp_name: ???
result_dir: results
# Previous run directory to resume from (checkpoint.pt / optimizer.pt /
# train_state.json / arena_stats.tsv are read; outputs go to a new run dir).
resume_dir: null
env_factory: null
trial_num: 1
seed: -1
render: true
render_scale: 1.0
off_wandb: false
wandb_group: default_group

# training
episode_limit: 1_000_000_000
time_limit_hour: 1_000_000_000
max_grad_norm: 5.0
sparsity: 0.0
gamma: 0.99
multi_gammas: []
horizon: 1
learning_starts: 2000
critic_loss_weight: 1.0
use_done: true
reset_on_episode_end: true
normalizing_by_return: false
image_save_interval: 100
print_interval: 5
debug: false
use_eligibility_trace: true
et_lambda: 0.5

replay_buffer:
  device: cpu
  size: 20000
  # Prioritized Experience Replay（off_policy のみ）。窓を引く確率は
  # (|TD 誤差| + priority_epsilon)^priority_alpha に比例し、critic の損失は
  # 重要度の重み (N * P)^(-priority_beta)（最大で正規化）で重み付けする。
  # priority_alpha: 0 で一様に引く（重みはすべて 1）
  priority_alpha: 0.6
  priority_beta: 0.4
  priority_epsilon: 0.01
